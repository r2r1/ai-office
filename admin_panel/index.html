<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Office — админка</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f2330;
    --border: #2a2e3a;
    --text: #e6e8ec;
    --text-dim: #8b909c;
    --accent: #5b8cff;
    --danger: #e0555a;
    --success: #4caf7d;
    --warning: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .server { color: var(--text-dim); font-size: 12px; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .gate {
    max-width: 420px; margin: 80px auto; padding: 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .gate h2 { margin-top: 0; font-size: 15px; }
  .gate .hint { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
  input, textarea, select {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; width: 100%;
  }
  button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: var(--surface); }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .pill.ok { background: rgba(76,175,125,.15); color: var(--success); }
  .pill.paused { background: rgba(217,164,65,.15); color: var(--warning); }
  .muted { color: var(--text-dim); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .broadcast { display: flex; gap: 8px; }
  .broadcast input { flex: 1; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px;
    opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw;
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .2s; padding: 20px; overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin-top: 0; }
  .error-entry { border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 12px; }
  .error-entry .kind { color: var(--danger); font-weight: 600; }
  .error-entry .ts { color: var(--text-dim); }
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Вход в админку</h2>
  <div class="hint">Адрес сервера AI-Office и ADMIN_API_KEY из его .env</div>
  <div class="stack">
    <div>
      <label>Адрес сервера</label>
      <input id="serverUrl" placeholder="https://office.example.com" />
    </div>
    <div>
      <label>Admin key</label>
      <input id="adminKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="X-Admin-Key" />
    </div>
    <button class="primary" onclick="enter()">Войти</button>
    <div id="gateError" class="muted"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>AI-Office — админка</h1>
    <div class="server"><span id="serverLabel"></span> · <a href="#" onclick="logout();return false" style="color:var(--text-dim)">выйти</a></div>
  </header>
  <main>
    <div class="panel">
      <h3>Прокси всем тенантам сразу</h3>
      <div class="broadcast">
        <input id="broadcastProxy" placeholder="socks5://user:pass@host:port или пусто, чтобы снять" />
        <button onclick="broadcastProxy()">Применить всем</button>
      </div>
    </div>

    <div class="toolbar">
      <div>Тенантов: <span id="tenantCount">—</span></div>
      <button onclick="loadTenants()">Обновить</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Тенант</th><th>Статус</th><th>Расход</th><th>Вызовы</th><th>Прокси</th><th>Свой ключ</th><th></th>
        </tr>
      </thead>
      <tbody id="tenantRows"></tbody>
    </table>
  </main>
</div>

<div id="backdrop" class="backdrop" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <h3 id="drawerTitle">Тенант</h3>
  <div class="stack">
    <div>
      <label>Прокси этого тенанта</label>
      <div class="row">
        <input id="drawerProxy" placeholder="пусто = общий LLM_PROXY_URL" />
        <button onclick="saveProxy()">Сохранить</button>
      </div>
    </div>
    <div class="row">
      <button id="drawerPauseBtn" onclick="togglePause()"></button>
    </div>
    <div>
      <label>Последние ошибки</label>
      <div id="errorsList" class="stack"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let SERVER = localStorage.getItem('admin_server') || '';
let KEY = localStorage.getItem('admin_key') || '';
let tenants = [];
let drawerTid = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts) {
  let res;
  try {
    res = await fetch(SERVER.replace(/\/$/, '') + path, {
      ...opts,
      headers: { 'X-Admin-Key': KEY, ...(opts && opts.headers) },
    });
  } catch (e) {
    // Сеть недоступна / сервер не отвечает / CORS отверг запрос — типичная
    // причина "страница как будто зависла": fetch кидает TypeError без
    // внятного сообщения, а не HTTP-ошибку.
    throw new Error('Не удалось подключиться к серверу: ' + e.message);
  }
  const body = await res.text().catch(() => '');
  if (!res.ok) {
    throw new Error(`${res.status}: ${body}`);
  }
  try {
    return body ? JSON.parse(body) : {};
  } catch (e) {
    throw new Error('Сервер ответил не JSON-ом (проверьте адрес сервера)');
  }
}

function enter() {
  SERVER = document.getElementById('serverUrl').value.trim();
  KEY = document.getElementById('adminKey').value.trim();
  if (!SERVER || !KEY) return;
  localStorage.setItem('admin_server', SERVER);
  localStorage.setItem('admin_key', KEY);
  document.getElementById('gateError').textContent = '';
  loadTenants(true);
}

function logout() {
  localStorage.removeItem('admin_key');
  KEY = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
}

async function loadTenants(fromGate) {
  try {
    const data = await api('/admin/api/tenants');
    tenants = data.tenants;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('serverLabel').textContent = SERVER;
    renderTenants();
  } catch (e) {
    if (fromGate) {
      document.getElementById('gateError').textContent = 'Не удалось подключиться: ' + e.message;
    } else {
      toast('Ошибка: ' + e.message);
    }
  }
}

function renderTenants() {
  document.getElementById('tenantCount').textContent = tenants.length;
  const rows = tenants.map(t => `
    <tr>
      <td><b>${escapeHtml(t.name || t.id)}</b><div class="muted">${t.id}</div></td>
      <td>${t.paused ? `<span class="pill paused">пауза</span><div class="muted">${escapeHtml(t.pause_reason||'')}</div>` : `<span class="pill ok">работает</span>`}</td>
      <td>$${(t.cost_total || 0).toFixed(4)}</td>
      <td>${t.calls_total}</td>
      <td>${t.has_proxy ? 'свой' : '<span class="muted">общий</span>'}</td>
      <td>${t.has_own_llm_key ? 'да' : '<span class="muted">нет</span>'}</td>
      <td><button onclick="openDrawer('${t.id}')">Управление</button></td>
    </tr>
  `).join('');
  document.getElementById('tenantRows').innerHTML = rows || '<tr><td colspan="7" class="muted">Нет тенантов</td></tr>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function openDrawer(tid) {
  drawerTid = tid;
  const t = tenants.find(x => x.id === tid);
  document.getElementById('drawerTitle').textContent = t.name || tid;
  document.getElementById('drawerPauseBtn').textContent = t.paused ? 'Возобновить' : 'Поставить на паузу';
  document.getElementById('drawerPauseBtn').className = t.paused ? 'primary' : 'danger';
  document.getElementById('drawerProxy').value = '';
  document.getElementById('errorsList').innerHTML = '<div class="muted">загрузка…</div>';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  try {
    const proxy = await api(`/admin/api/tenant/${tid}/proxy`);
    document.getElementById('drawerProxy').value = proxy.proxy_url || '';
  } catch (e) { toast('Ошибка: ' + e.message); }
  try {
    const errs = await api(`/admin/api/tenant/${tid}/errors`);
    renderErrors(errs.errors);
  } catch (e) { toast('Ошибка: ' + e.message); }
}

function renderErrors(errors) {
  const el = document.getElementById('errorsList');
  if (!errors.length) { el.innerHTML = '<div class="muted">Ошибок не найдено</div>'; return; }
  el.innerHTML = errors.slice().reverse().map(e => `
    <div class="error-entry">
      <span class="ts">${escapeHtml(e.ts || '')}</span> <span class="kind">${escapeHtml(e.kind || '')}</span>
      <div>${escapeHtml(e.error || e.text || e.summary || '')}</div>
    </div>
  `).join('');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  drawerTid = null;
}

async function togglePause() {
  const t = tenants.find(x => x.id === drawerTid);
  try {
    if (t.paused) {
      await api(`/admin/api/tenant/${drawerTid}/resume`, { method: 'POST' });
    } else {
      await api(`/admin/api/tenant/${drawerTid}/pause?reason=${encodeURIComponent('остановлено администратором')}`, { method: 'POST' });
    }
    await loadTenants();
    openDrawer(drawerTid);
  } catch (e) { toast('Ошибка: ' + e.message); }
}

async function saveProxy() {
  const val = document.getElementById('drawerProxy').value.trim();
  try {
    await api(`/admin/api/tenant/${drawerTid}/proxy?proxy_url=${encodeURIComponent(val)}`, { method: 'POST' });
    toast('Прокси сохранён');
    await loadTenants();
  } catch (e) { toast('Ошибка: ' + e.message); }
}

async function broadcastProxy() {
  const val = document.getElementById('broadcastProxy').value.trim();
  if (!confirm(val ? `Поставить этот прокси ВСЕМ тенантам?` : `Снять персональный прокси у ВСЕХ тенантов?`)) return;
  try {
    const res = await api(`/admin/api/proxy/broadcast?proxy_url=${encodeURIComponent(val)}`, { method: 'POST' });
    toast(`Применено к ${res.updated.length} тенантам`);
    await loadTenants();
  } catch (e) { toast('Ошибка: ' + e.message); }
}

if (SERVER && KEY) {
  document.getElementById('serverUrl').value = SERVER;
  document.getElementById('adminKey').value = KEY;
  loadTenants(true);
}
</script>
</body>
</html>
