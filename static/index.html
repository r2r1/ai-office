<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Office</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
  #layout { display: flex; width: 100vw; height: 100vh; }
  #game-wrap { flex: 1; position: relative; }
  canvas { display: block; image-rendering: pixelated; }
  #sidebar {
    width: 280px; background: #0f0f1a; border-left: 2px solid #1a1a2e;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-title {
    padding: 10px 14px; background: #1a1a2e; font-size: 13px;
    font-weight: bold; color: #4fc3f7; border-bottom: 1px solid #2a2a4e;
    letter-spacing: 1px;
  }
  #agents-list { padding: 8px; border-bottom: 1px solid #1a1a2e; }
  .agent-card {
    padding: 6px 8px; margin-bottom: 4px; border-radius: 3px;
    background: #131320; border-left: 3px solid #333;
    font-size: 11px; line-height: 1.4;
  }
  .agent-card .name { font-weight: bold; font-size: 12px; }
  .agent-card .task { color: #888; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log-title { padding: 8px 14px 4px; font-size: 11px; color: #666; }
  #log {
    flex: 1; overflow-y: auto; padding: 6px 8px;
    font-size: 10px; line-height: 1.6;
  }
  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: #0a0a0f; }
  #log::-webkit-scrollbar-thumb { background: #2a2a4e; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #111; }
  .log-entry .who { font-weight: bold; }
  #status-bar {
    padding: 5px 10px; background: #080812; font-size: 10px;
    color: #444; border-top: 1px solid #1a1a2e;
  }
  canvas { cursor: pointer; }
  #hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(15,15,26,0.9); color: #6a6a9e; font-size: 11px;
    padding: 6px 14px; border-radius: 12px; border: 1px solid #2a2a4e;
    pointer-events: none; transition: opacity 0.5s;
  }
  /* --- Чат-окно --- */
  #chat-window {
    position: absolute; bottom: 16px; right: 16px; width: 340px; height: 440px;
    background: #0f0f1a; border: 2px solid #2a2a4e; border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 10;
  }
  #chat-window.hidden { display: none; }
  #chat-header {
    padding: 10px 14px; background: #1a1a2e; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2a4e;
  }
  #chat-title { font-weight: bold; font-size: 13px; }
  #chat-close { cursor: pointer; color: #888; font-size: 14px; }
  #chat-close:hover { color: #f06292; }
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 10px; display: flex;
    flex-direction: column; gap: 8px; font-size: 12px; line-height: 1.4;
  }
  #chat-messages::-webkit-scrollbar { width: 5px; }
  #chat-messages::-webkit-scrollbar-thumb { background: #2a2a4e; border-radius: 3px; }
  .msg { padding: 7px 10px; border-radius: 8px; max-width: 85%; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2d4a6e; color: #e0f0ff; }
  .msg.agent { align-self: flex-start; background: #1a1a2e; color: #d0d0e0; }
  .msg.typing { align-self: flex-start; background: #1a1a2e; color: #666; font-style: italic; }
  #chat-input-row { display: flex; padding: 8px; gap: 6px; border-top: 1px solid #1a1a2e; }
  #chat-input {
    flex: 1; background: #131320; border: 1px solid #2a2a4e; border-radius: 6px;
    padding: 8px; color: #e0e0e0; font-family: inherit; font-size: 12px; outline: none;
  }
  #chat-input:focus { border-color: #4fc3f7; }
  #chat-send {
    background: #2d4a6e; border: none; border-radius: 6px; color: #fff;
    padding: 0 14px; cursor: pointer; font-size: 14px;
  }
  #chat-send:hover { background: #3d5a8e; }
  #chat-send:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div id="layout">
  <div id="game-wrap">
    <canvas id="canvas"></canvas>
    <div id="hint">👆 Кликни на сотрудника, чтобы поговорить с ним</div>

    <!-- Чат-окно с агентом -->
    <div id="chat-window" class="hidden">
      <div id="chat-header">
        <span id="chat-title">Агент</span>
        <span id="chat-close">✕</span>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Спроси что-нибудь..." autocomplete="off">
        <button id="chat-send">▶</button>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-title">⚡ AI OFFICE</div>
    <div id="agents-list"></div>
    <div id="log-title">СОБЫТИЯ</div>
    <div id="log"></div>
    <div id="status-bar">● подключение...</div>
  </div>
</div>
<script src="/static/game.js"></script>
</body>
</html>
