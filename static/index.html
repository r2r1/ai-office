<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Office</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
  #layout { display: flex; width: 100vw; height: 100vh; }
  #game-wrap { flex: 1; position: relative; }
  canvas { display: block; image-rendering: pixelated; }
  #sidebar {
    width: 280px; background: #0f0f1a; border-left: 2px solid #1a1a2e;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-title {
    padding: 10px 14px; background: #1a1a2e; font-size: 13px;
    font-weight: bold; color: #4fc3f7; border-bottom: 1px solid #2a2a4e;
    letter-spacing: 1px;
  }
  #agents-list { padding: 8px; border-bottom: 1px solid #1a1a2e; }
  .agent-card {
    padding: 6px 8px; margin-bottom: 4px; border-radius: 3px;
    background: #131320; border-left: 3px solid #333;
    font-size: 11px; line-height: 1.4;
  }
  .agent-card .name { font-weight: bold; font-size: 12px; }
  .agent-card .task { color: #888; font-size: 10px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log-title { padding: 8px 14px 4px; font-size: 11px; color: #666; }
  #log {
    flex: 1; overflow-y: auto; padding: 6px 8px;
    font-size: 10px; line-height: 1.6;
  }
  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: #0a0a0f; }
  #log::-webkit-scrollbar-thumb { background: #2a2a4e; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #111; }
  .log-entry .who { font-weight: bold; }
  #status-bar {
    padding: 5px 10px; background: #080812; font-size: 10px;
    color: #444; border-top: 1px solid #1a1a2e;
  }
</style>
</head>
<body>
<div id="layout">
  <div id="game-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div id="sidebar">
    <div id="sidebar-title">⚡ AI OFFICE</div>
    <div id="agents-list"></div>
    <div id="log-title">СОБЫТИЯ</div>
    <div id="log"></div>
    <div id="status-bar">● подключение...</div>
  </div>
</div>
<script src="/static/game.js"></script>
</body>
</html>
